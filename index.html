<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>27 Exposures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Reenie+Beanie&family=VT323&display=swap">
<style>
/* Layout: one letterboxed 960x540 viewfinder, scaled to fit. The 3D view renders at 256x144 and is blown up with hard pixels. */
:root{
  --ink:#cfc8b8; --dim:#6b665c; --ember:#ff8a2a; --led-red:#ff3b30; --led-green:#4cff6a;
  --paper:#e6dfcb; --paper-ink:#2a2620; --bone:#ddd6c6;
  --type:"Special Elite","Courier New",monospace;
  --hand:"Reenie Beanie","Bradley Hand","Segoe Print",cursive;
  --digit:"VT323",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:var(--type);overflow:hidden;display:grid;place-items:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;transform-origin:0 0;background:#000;user-select:none;-webkit-user-select:none;touch-action:none}
#view,#grain,#scare{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated}
#grain{mix-blend-mode:screen;opacity:.07;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 42%,rgba(0,0,0,.8) 100%)}
#scare{z-index:40}
#shake.on{animation:shake .06s linear infinite}
@keyframes shake{0%{transform:translate(8px,-6px)}25%{transform:translate(-9px,4px)}50%{transform:translate(5px,8px)}75%{transform:translate(-6px,-7px)}100%{transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

/* camera back: flash-ready LED, frame counter window, wind reminder */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
#cam{position:absolute;right:22px;bottom:20px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#111;border:2px solid #262626;border-radius:10px;box-shadow:0 4px 0 #050505}
.led{width:10px;height:10px;border-radius:50%;background:#2a1717}
.led.ready{background:var(--led-green);box-shadow:0 0 10px var(--led-green)}
.led.charge{background:var(--led-red);box-shadow:0 0 8px var(--led-red);animation:blink .3s steps(1) infinite}
.win{width:46px;height:46px;border-radius:50%;background:#050505;border:3px solid #333;display:grid;place-items:center;font:30px var(--digit);color:var(--ember);text-shadow:0 0 6px rgba(255,138,42,.6)}
.wind{font:13px var(--type);color:#363636;letter-spacing:.12em}
.wind.on{color:var(--bone);animation:blink .8s steps(1) infinite}
#prompt{position:absolute;bottom:28px;left:120px;right:120px;text-align:center;font:18px var(--type);color:var(--ink);text-shadow:0 0 8px #000,0 0 3px #000}
#sub{position:absolute;top:22px;left:0;right:0;text-align:center;font:17px var(--type);color:#a39c8d;text-shadow:0 0 6px #000;opacity:0;transition:opacity .6s}
#sub.on{opacity:1}

/* grandmother's notes */
#note{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.72)}
.paper{width:520px;box-sizing:border-box;padding:34px 42px 22px;background:radial-gradient(circle at 80% 20%,rgba(120,90,40,.18),transparent 40%),radial-gradient(circle at 15% 85%,rgba(90,60,30,.2),transparent 35%),var(--paper);
  color:var(--paper-ink);transform:rotate(-1.5deg);box-shadow:0 20px 60px rgba(0,0,0,.8)}
.paper p{font:36px/1.08 var(--hand);margin:0;white-space:pre-line}
.paper small{display:block;margin-top:18px;font:13px var(--type);color:#7a705e;text-align:right}

/* full-screen cards: title, intro, death, ending */
#screen{position:absolute;inset:0;z-index:50;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:#000;pointer-events:auto;padding:0 60px;box-sizing:border-box}
.ov h1{font:68px var(--type);letter-spacing:.06em;color:var(--bone);margin:0;text-shadow:2px 0 rgba(255,60,40,.35),-2px 0 rgba(60,180,255,.3)}
.ov h2{font:30px var(--type);color:var(--bone);margin:0;letter-spacing:.05em}
.ov p{font:20px/1.6 var(--type);color:var(--ink);max-width:700px;margin:0}
.ov .lines p{opacity:0;transition:opacity 1.2s}
.ov .lines p.on{opacity:1}
.btn{font:19px var(--type);color:var(--bone);background:transparent;border:1px solid #5a554b;padding:10px 28px;cursor:pointer;letter-spacing:.08em}
.btn:hover,.btn:focus-visible{border-color:var(--ember);color:var(--ember);outline:none}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.small{font:14px/1.6 var(--type);color:var(--dim);max-width:640px}
.chk{font:15px var(--type);color:var(--dim)}
.chk input{accent-color:var(--ember);vertical-align:-2px;margin-right:6px}
.red{color:#c43a2a!important}
.pulse{animation:blink 1.6s steps(1) infinite}

/* the developed roll */
.sheet{display:grid;grid-template-columns:repeat(7,104px);gap:16px 8px;padding:12px 16px 20px;background:#1b1009;border-block:12px dashed #2c1a0c}
.frame{position:relative;width:104px;height:58px;background:#050505}
.frame canvas{width:104px;height:58px;image-rendering:pixelated;display:block;opacity:0;transition:opacity .9s}
.frame canvas.on{opacity:1}
.frame span{position:absolute;bottom:-15px;left:2px;font:12px var(--digit);color:var(--ember)}
.big{width:640px;height:360px;image-rendering:pixelated;border:10px solid #e8e2d4;box-shadow:0 20px 60px rgba(0,0,0,.9)}

/* touch controls (phones and tablets only) */
#touch{position:absolute;inset:0;z-index:25}
#stick{position:absolute;left:40px;bottom:40px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
#knob{position:absolute;left:50px;top:50px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15)}
.tb{position:absolute;right:30px;width:92px;height:56px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:var(--bone);font:16px var(--type)}
#tFlash{bottom:150px}#tWind{bottom:84px}#tUse{bottom:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>


<div id="wrap"><div id="stage"><div id="shake">
  <canvas id="view" width="256" height="144"></canvas>
  <canvas id="grain" width="160" height="90"></canvas>
  <div id="vig"></div>
  <div id="hud" hidden>
    <div id="sub"></div>
    <div id="prompt"></div>
    <div id="cam"><span class="led" id="led"></span><div class="win"><span id="count">27</span></div><span class="wind" id="wind">WIND · R</span></div>
  </div>
  <canvas id="scare" width="128" height="72" hidden></canvas>
  <div id="note" hidden><div class="paper"><p id="noteText"></p><small>E · put it down</small></div></div>
  <div id="touch" hidden><div id="stick"><div id="knob"></div></div><button class="tb" id="tFlash">FLASH</button><button class="tb" id="tWind">WIND</button><button class="tb" id="tUse">USE</button></div>
  <div id="screen"></div>
</div></div></div>

<script>
'use strict';

/* ---------- audio: everything is synthesized. Positional sounds take (rel, d):
   rel = angle of the source relative to where the player faces, d = distance in tiles. ---------- */
const AU={ctx:null,out:null,amb:null,nb:null,crush:null,
  init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{this.ctx=new C()}catch(e){return}
    const c=this.ctx,comp=c.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=6;comp.connect(c.destination);
    this.out=c.createGain();this.out.gain.value=.95;this.out.connect(comp);
    this.amb=c.createGain();this.amb.gain.value=1;this.amb.connect(this.out);
    const len=c.sampleRate*3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
    const ws=c.createWaveShaper(),cu=new Float32Array(2048);for(let i=0;i<2048;i++)cu[i]=Math.tanh((i/1024-1)*7);ws.curve=cu;this.crush=ws;ws.connect(this.out)},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  get t(){return this.ctx?this.ctx.currentTime:0},
  env(g,t,a,v,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel)},
  osc(type,f,t,dur,v,o={}){const c=this.ctx;if(!c)return;const s=c.createOscillator(),g=c.createGain();s.type=type;s.frequency.setValueAtTime(f,t);
    if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+(o.a||.005)+(o.hold||0)+dur);if(o.det)s.detune.value=o.det;
    this.env(g,t,o.a||.005,v,o.hold||0,dur);s.connect(g);g.connect(o.dest||this.out);s.start(t);s.stop(t+(o.a||.005)+(o.hold||0)+dur+.1);return s},
  noise(t,dur,v,o={}){const c=this.ctx;if(!c)return;const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;const f=c.createBiquadFilter();f.type=o.type||'bandpass';
    f.frequency.setValueAtTime(o.f||1000,t);if(o.fTo)f.frequency.exponentialRampToValueAtTime(o.fTo,t+(o.a||.003)+(o.hold||0)+dur);f.Q.value=o.q==null?.7:o.q;
    const g=c.createGain();this.env(g,t,o.a||.003,v,o.hold||0,dur);s.connect(f);f.connect(g);g.connect(o.dest||this.out);s.start(t,Math.random()*2);s.stop(t+(o.a||.003)+(o.hold||0)+dur+.1);return{s,f,g}},
  /* a source behind you is panned and muffled, so you can tell front from back on headphones */
  spatial(rel,d,gain=1){const c=this.ctx,g=c.createGain();g.gain.value=gain*Math.min(1.3,1.8/(1+d*d*.16));let n=g;
    if(Math.cos(rel)<0){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;g.connect(f);n=f}
    const p=c.createStereoPanner();p.pan.value=Math.sin(rel)*.95;n.connect(p);p.connect(this.out);return g},

  /* camera */
  shutter(){if(!this.ctx)return;const t=this.t;this.noise(t,.035,.6,{type:'highpass',f:3000});this.noise(t+.045,.06,.35,{f:1700,q:2});this.osc('square',95,t,.04,.08)},
  whine(dur){if(!this.ctx)return;this.osc('sine',2500,this.t,dur,.016,{to:7600,a:.06})},
  dry(){if(!this.ctx)return;this.noise(this.t,.02,.22,{type:'highpass',f:4200})},
  ratchet(){if(!this.ctx)return;const t=this.t;this.noise(t,.016,.3,{f:3600,q:7});this.noise(t+.035,.012,.15,{f:2600,q:7})},

  /* the player */
  step(run){if(!this.ctx)return;const t=this.t;this.noise(t,run?.09:.06,run?.2:.06,{type:'lowpass',f:run?520:300});if(Math.random()<.25)this.noise(t+.02,.25,.025,{f:400+Math.random()*300,q:14})},
  bump(){if(!this.ctx)return;const t=this.t;this.osc('sine',70,t,.18,.3,{to:40});this.noise(t,.08,.18,{type:'lowpass',f:300})},
  paper(){if(!this.ctx)return;const t=this.t;for(let i=0;i<4;i++)this.noise(t+i*.05,.06,.12,{type:'highpass',f:2500+Math.random()*2000})},
  keys(){if(!this.ctx)return;const t=this.t;for(let i=0;i<5;i++)this.noise(t+i*.07+Math.random()*.03,.03,.18,{f:4500+Math.random()*2500,q:12})},

  /* the house */
  tick(rel,d,hi){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,.6);this.noise(t,.02,.6,{f:hi?3400:2500,q:9,dest});this.osc('sine',hi?1900:1500,t,.03,.05,{dest})},
  bong(rel,d){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1);[110,220.6,331.5,442.9].forEach((f,i)=>this.osc('sine',f,t,3.2-i*.5,.18/(i+1),{a:.004,dest}))},
  creak(){if(!this.ctx)return;const t=this.t;this.noise(t,1.1+Math.random(),.05,{f:250+Math.random()*400,fTo:180+Math.random()*900,q:22,a:.25,dest:this.amb})},
  knock(rel,d){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1.3);for(let i=0;i<3;i++){this.osc('sine',85,t+i*.32,.16,.5,{to:55,dest});this.noise(t+i*.32,.06,.3,{type:'lowpass',f:500,dest})}},
  slam(rel,d){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1.6);this.osc('sine',55,t,.6,.9,{to:32,dest});this.noise(t,.35,.6,{type:'lowpass',f:420,dest});this.noise(t+.02,.08,.4,{f:1500,q:3,dest})},
  doorOpen(){if(!this.ctx)return;const t=this.t;this.noise(t,.05,.4,{f:2200,q:6});this.noise(t+.1,1.8,.12,{f:500,fTo:900,q:25,a:.3});this.osc('sine',60,t+.05,.4,.3,{to:40})},

  /* it */
  cstep(rel,d){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1.1);this.osc('sine',52,t,.22,.65,{to:34,dest});this.noise(t,.1,.35,{type:'lowpass',f:360,dest});
    this.noise(t+.05,.018,.35,{f:2900,q:11,dest});if(Math.random()<.4)this.noise(t+.11,.016,.25,{f:3300,q:11,dest})},
  breath(rel,d,inhale){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1.2);
    this.noise(t,inhale?.9:1.2,.3,{f:inhale?850:620,fTo:inhale?1500:380,q:1.3,a:.35,dest});this.noise(t,inhale?.9:1.2,.06,{type:'lowpass',f:200,a:.3,dest})},
  whisper(rel,d){if(!this.ctx)return;const t=this.t,dest=this.spatial(rel,d,1.4),n=5+(Math.random()*5|0);
    for(let i=0;i<n;i++){const t0=t+i*.12+Math.random()*.06;this.noise(t0,.08+Math.random()*.06,.22,{f:1100+Math.random()*2200,q:5,a:.02,dest})}},
  heart(v){if(!this.ctx)return;const t=this.t;this.osc('sine',50,t,.14,.6*v,{to:32});this.osc('sine',47,t+.17,.12,.42*v,{to:30})},

  /* scares */
  stinger(){if(!this.ctx)return;const t=this.t,c=this.ctx,f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(5000,t+.25);f.connect(this.out);
    [65.4,69.3,98,103.8,138.6].forEach(fr=>this.osc('sawtooth',fr,t,1.7,.1,{a:.03,det:Math.random()*30-15,dest:f}));
    this.osc('sine',2350,t,1.3,.05,{to:1750,a:.02});this.noise(t,.5,.25,{type:'highpass',f:1500,a:.01})},
  scream(v=1){if(!this.ctx)return;const t=this.t,k=v*(G.gentle?.35:1);
    [[540,170],[630,150],[390,120],[820,240]].forEach(([a,b])=>this.osc('sawtooth',a,t,1.15,.22*k,{to:b,a:.01,det:Math.random()*40,dest:this.crush}));
    this.noise(t,1.1,.9*k,{f:1400,fTo:700,q:.9,a:.005,dest:this.crush});this.osc('sine',38,t,1,.8*k,{to:25})},

  /* bed of dread under everything */
  ambientOn(){if(!this.ctx||this._amb)return;const c=this.ctx,t=this.t;
    const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=320;const g=c.createGain();g.gain.value=.05;
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.06;lg.gain.value=.035;lfo.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(this.amb);s.start();lfo.start();
    const d1=c.createOscillator(),d2=c.createOscillator(),dg=c.createGain();d1.frequency.value=41;d2.frequency.value=43.2;dg.gain.value=.03;d1.connect(dg);d2.connect(dg);dg.connect(this.amb);d1.start();d2.start();
    this._amb={dg}},
  dread(v,secs=1.5){if(!this._amb)return;this._amb.dg.gain.setTargetAtTime(.03+v*.09,this.t,secs)},
  duck(on){if(this.amb)this.amb.gain.setTargetAtTime(on?.15:1,this.t,on?.05:1.2)}
};

/* ---------- art: every texture and sprite is painted with canvas calls at startup ---------- */
const TEX={};
let _seed=11;const srand=()=>(_seed=(_seed*16807)%2147483647)/2147483647;
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function bake(name,w,h,draw,o={}){const c=mkCanvas(w,h),g=c.getContext('2d');draw(g,w,h);
  TEX[name]={w,h,d:g.getImageData(0,0,w,h).data,em:o.em?o.em(w,h):null,eyes:o.eyes||null,canvas:c}}
function grime(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=srand()<.5?`rgba(0,0,0,${a*srand()})`:`rgba(255,240,210,${a*.4*srand()})`;g.fillRect(srand()*w|0,srand()*h|0,1+(srand()*2|0),1+(srand()*2|0))}}
function stains(g,w,h,n){for(let i=0;i<n;i++){const x=srand()*w,y=srand()*h*.8,r=6+srand()*16,gr=g.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,'rgba(70,45,15,.32)');gr.addColorStop(1,'rgba(70,45,15,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}}
function line(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke()}
function baseboard(g,w){g.fillStyle='#3a291b';g.fillRect(0,55,w,9);g.fillStyle='#24180f';g.fillRect(0,55,w,1)}

/* walls */
bake('wall',64,64,(g,w,h)=>{g.fillStyle='#7d8265';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=8){g.fillStyle='#70775a';g.fillRect(x,0,3,h)}
  g.fillStyle='#8c9173';for(let y=4;y<52;y+=10)for(let x=((y/10|0)%2)*4+2;x<w;x+=8)g.fillRect(x,y,2,3);
  stains(g,w,h,5);g.fillStyle='rgba(60,40,20,.25)';for(let i=0;i<4;i++){const x=srand()*w|0;g.fillRect(x,srand()*20|0,1,20+srand()*30)}baseboard(g,w);grime(g,w,h,260,.25)});
bake('panel',64,64,(g,w,h)=>{g.fillStyle='#4b2e2a';g.fillRect(0,0,w,30);g.fillStyle='#5a3833';for(let y=3;y<28;y+=8)for(let x=((y/8|0)%2)*6+2;x<w;x+=12)g.fillRect(x,y,3,3);
  g.fillStyle='#4a301d';g.fillRect(0,30,w,34);for(let x=0;x<w;x+=8){g.fillStyle='#3a2516';g.fillRect(x,30,1,34);g.fillStyle='rgba(255,220,170,.05)';g.fillRect(x+3,30,1,34)}
  g.fillStyle='#6b4a2e';g.fillRect(0,29,w,3);g.fillStyle='#2b1b10';g.fillRect(0,32,w,1);stains(g,w,30,3);grime(g,w,h,300,.3)});
bake('frame',64,64,(g,w,h)=>{g.drawImage(TEX.panel.canvas,0,0);g.fillStyle='#8a6a2c';g.fillRect(16,3,32,25);g.fillStyle='#5e4718';g.fillRect(18,5,28,21);
  g.fillStyle='#a08a66';g.fillRect(20,7,24,17);g.fillStyle='#3b3024';[[24,12],[31,10],[38,12]].forEach(([x,y])=>{g.fillRect(x-2,y+3,5,9);g.fillRect(x-1,y,3,3)});
  g.strokeStyle='#efe8da';g.lineWidth=1;[[24,12],[31,10],[38,12]].forEach(([x,y])=>{line(g,[[x-2,y-1],[x+2,y+3],[x-2,y+3],[x+2,y-1]])});grime(g,w,h,80,.3)});
bake('rose',64,64,(g,w,h)=>{g.fillStyle='#8c6a68';g.fillRect(0,0,w,h);for(let y=5;y<52;y+=12)for(let x=((y/12|0)%2)*8+4;x<w;x+=16){g.fillStyle='#a3787a';g.fillRect(x,y,4,4);g.fillStyle='#5e6a4c';g.fillRect(x+4,y+3,3,2)}

    const plan={2:[6,9,'cr_stand'],4:[3.8,5.2,'cr_crawl'],6:[2.3,3,'cr_arms'],8:[1.05,1.35,'cr_stand']}[n]||(n>8&&Math.random()<.4?[rand(2,3.5),rand(4.5,7),T[Math.random()*3|0]]:null);
    if(!plan)return;const s=spotInView(plan[0],plan[1]);if(!s)return;crPlace(s[0],s[1],plan[2],'pose');c.near=0;c.life=99;c.jump=plan[0]<1.5},
  onNote(id){if(id==='n4')setTimeout(()=>AU.knock(angleTo(G.p,.6,7.5),dist(.6,7.5)),3000)},
  takeKey(){prop('key').gone=true;G.hasKey=true;AU.keys();G.flags.keyNote=1;openNote('Taped to the key, in her handwriting:\n\nDon\'t come back for the camera.')},
  hunt(){G.phase=2;G.ck={film:G.film,shots:G.shots.length};AU.slam(angleTo(G.p,23.5,2.5),dist(23.5,2.5));AU.stinger();AU.dread(1);
    crPlace(23.5,1.6,'cr_arms','hunt');G.cr.frozen=2.6;setTimeout(()=>say('Get to the front door.',3),1500)},

  async caught(){if(G.state!=='play')return;G.state='dead';unlockMouse();G.deaths++;await faceScare(1.25,1);deathScreen()},
  async escape(){if(G.state!=='play')return;G.state='end';unlockMouse();$('#hud').hidden=true;$('#touch').hidden=true;AU.doorOpen();AU.dread(0);crGone();
    show('<div class="ov" style="background:#f4efe2"></div>');await sleep(1200);
    await lines(['You ran until you reached the streetlights.','At 3:33 AM a neighbor found you on the curb, still holding the camera.','The next Monday, the pharmacy developed the roll.'],2600);contactSheet()}
};

async function lines(L,gap){const r=show(`<div class="ov"><div class="lines">${L.map(l=>`<p>${l}</p>`).join('')}</div></div>`);let skip=false;r.addEventListener('mousedown',()=>skip=true);
  for(const p of r.querySelectorAll('.lines p')){p.classList.add('on');await sleep(skip?200:gap)}await sleep(skip?200:900)}

/* ---------- screens ---------- */
function titleScreen(){G.state='title';$('#hud').hidden=true;$('#touch').hidden=true;
  const r=show(`<div class="ov"><h1>27 EXPOSURES</h1><p>A dark house. A disposable camera. Something that only moves while nobody is looking at it.</p>
    <div class="row"><button class="btn" id="go">Begin</button></div>
    <label class="chk"><input type="checkbox" id="gentle">Gentle mode: dimmer flash, quieter scream, no shaking</label>
    <p class="small">Headphones on. Lights off. Play alone.<br>Contains loud jumpscares and bright camera flashes.</p>
    <p class="small">${touchMode?'Left stick moves · drag to look · FLASH, WIND and USE buttons on the right':'WASD move · mouse look · click or Space: flash · R or wheel: wind film · E: use · Shift: run (it hears you)'}</p>
    <p class="small">Made for Hack Club Scare</p></div>`);
  r.querySelector('#gentle').checked=G.gentle;r.querySelector('#go').addEventListener('click',()=>{AU.init();AU.resume();G.gentle=r.querySelector('#gentle').checked;intro()})}
async function intro(){resetGame();
  await lines(['October 31st. 2:51 AM.','The night after Grandma\'s funeral, the power went out.','Your phone is dead. The front door is deadbolted from the inside.','Her key is in her bedroom, at the end of the hall.','All you have is the disposable camera from her kitchen drawer.','27 exposures.'],2300);
  const r=show('<div class="ov"><p class="pulse">Click to open your eyes.</p></div>');r.addEventListener('click',()=>begin(),{once:true})}
function begin(){show('');$('#hud').hidden=false;$('#touch').hidden=!touchMode;G.state='play';last=performance.now();AU.init();AU.resume();AU.ambientOn();lock();
  if(G.phase===1)setTimeout(()=>say('It\'s too dark to see anything. Take a picture: click or Space.',6),600)}
function resetGame(){Object.assign(G,{p:{x:3.5,y:7.5,a:0},film:27,wound:true,charge:0,flashT:99,adapt:0,phase:1,hasKey:false,noise:0,flags:{},shots:[],note:false,unlock:0,clockStop:0,playT:0,ck:null,windN:0,mv:{x:0,y:0}});
  crGone();PROPS.forEach(p=>p.gone=false);prop('bed').tex='bed_occ';const ch=prop('chair');ch.tex='chair';ch.h=.9;AU.dread(0)}
function restart(){const ck=G.ck;Object.assign(G,{p:{x:22.6,y:7.5,a:Math.PI},film:Math.max(ck.film,5),wound:true,charge:0,flashT:99,adapt:3,noise:0,unlock:0,note:false});
  G.shots.length=ck.shots;G.flags.ahead=0;crPlace(23.5,1.6,'cr_arms','hunt');G.cr.frozen=2.8}
function deathScreen(){$('#hud').hidden=true;$('#touch').hidden=true;const t=`3:${pad(Math.min(59,6+Math.floor(G.playT/15)))} AM`;
  const r=show(`<div class="ov"><h2 class="red">It reached you.</h2><p>${t}. ${G.film} exposure${G.film===1?'':'s'} left on the roll.</p>
    <p class="small">${G.film>0?'When it gets close, give it the flash. It can\'t move while it\'s being looked at.':'You had nothing left to show it.'}</p>
    <div class="row"><button class="btn" id="retry">Try again from the bedroom</button><button class="btn" id="quit">Title</button></div></div>`);
  r.querySelector('#retry').addEventListener('click',()=>{restart();begin()});r.querySelector('#quit').addEventListener('click',titleScreen)}

/* ---------- the developed roll ---------- */
function insertion(s){const fx=Math.cos(s.a),fy=Math.sin(s.a),qx=-fy,qy=fx;for(const d of [2.6,3.4,1.9,4.2,1.4])for(const o of [.55,-.55,.25,-.25,0,.9,-.9]){
  const x=s.x+fx*d+qx*o,y=s.y+fy*d+qy*o;if(!blocked(x,y,.2)&&los(s.x,s.y,x,y))return{x,y,tex:Math.random()<.2?'cr_crawl':'cr_stand'}}return null}
function renderShot(s,cv){const g=cv.getContext('2d'),img=g.createImageData(cv.width,cv.height),sp=[];PROPS.forEach((p,i)=>{if(s.props[i])sp.push({...p,tex:s.props[i],h:s.props[i]==='chair_occ'?1.35:p.h})});
  const cr=s.cr||insertion(s);if(cr)sp.push({x:cr.x,y:cr.y,tex:cr.tex,h:cr.tex==='cr_crawl'?.5:1.3});render(img.data,cv.width,cv.height,s,{flash:1,amb:.015,moon:.6,sprites:sp,grain:20});g.putImageData(img,0,0)}
async function contactSheet(){const n=G.shots.length,dd=new Date(),dev=`${pad(dd.getMonth()+1)}/${pad(dd.getDate())}`;
  const r=show(`<div class="ov" style="gap:16px"><p class="small">ROLL 1 · ${n} OF 27 EXPOSURES · DEVELOPED ${dev}</p><div class="sheet"></div><p id="cap" style="min-height:1.6em"></p><div class="row" id="more" hidden><button class="btn" id="one">There's one more print in the envelope</button></div></div>`);
  const sheet=r.querySelector('.sheet'),cvs=[];for(let i=0;i<27;i++){const f=document.createElement('div');f.className='frame';const cv=mkCanvas(128,72);f.appendChild(cv);const s=document.createElement('span');s.textContent=i+1;f.appendChild(s);sheet.appendChild(f);cvs.push(cv)}
  for(let i=0;i<27;i++){await sleep(i<n?360:70);const cv=cvs[i];if(i<n){renderShot(G.shots[i],cv);AU.paper()}else{const g=cv.getContext('2d'),gr=g.createLinearGradient(0,0,128,0);gr.addColorStop(0,'rgba(255,120,30,.25)');gr.addColorStop(.3,'#0a0603');gr.addColorStop(1,'#050302');g.fillStyle=gr;g.fillRect(0,0,128,72)}cv.classList.add('on')}
  const cap=r.querySelector('#cap');await sleep(1400);cap.textContent=n?'You never saw it in most of these.':'You didn\'t take a single picture.';await sleep(2800);
  cap.textContent='It was in every one.';cap.classList.add('red');AU.stinger();await sleep(2400);r.querySelector('#more').hidden=false;r.querySelector('#one').addEventListener('click',finalPrint,{once:true})}
async function finalPrint(){const now=new Date(),st=`${pad(now.getMonth()+1)} ${pad(now.getDate())} '${String(now.getFullYear()).slice(2)}  ${now.getHours()}:${pad(now.getMinutes())}`;
  const r=show('<div class="ov" style="gap:20px"><canvas class="big" width="256" height="144"></canvas><p id="cap2" style="min-height:3.4em"></p></div>');
  const cv=r.querySelector('canvas'),g=cv.getContext('2d'),img=g.createImageData(256,144);
  render(img.data,256,144,{x:23.5,y:2.7,a:Math.PI/2},{flash:1,amb:.015,moon:.6,grain:16,sprites:[{x:23.4,y:5,tex:'bed_occ',h:.6},{x:22.75,y:5.0,tex:'cr_stand',h:1.3},{x:21.5,y:4.6,tex:'stand',h:.5}]});
  g.putImageData(img,0,0);g.font='11px VT323, monospace';g.textAlign='right';g.fillStyle='rgba(255,140,40,.95)';g.fillText(st,248,137);AU.paper();
  const cap=r.querySelector('#cap2'),add=async(t,ms)=>{cap.innerHTML+=(cap.innerHTML?'<br>':'')+t;await sleep(ms)};
  await sleep(1500);await add('Exposure 28.',1700);await add('The roll only had 27.',2000);AU.stinger();await add('<span class="red">It\'s stamped with today\'s date. And the time on your clock right now.</span>',4200);
  const e=show(`<div class="ov"><h1>27 EXPOSURES</h1><p class="small">Thanks for playing. Made for Hack Club Scare.</p><div class="row"><button class="btn" id="again">Play again</button></div></div>`);
  e.querySelector('#again').addEventListener('click',titleScreen)}

titleScreen();requestAnimationFrame(frame);

</script>
